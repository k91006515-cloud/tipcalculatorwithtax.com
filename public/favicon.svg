  <rect x="44.5" y="37" width="7" height="7" rx="1.5" fill="#050505"/>
  <rect x="58" y="37" width="7" height="7" rx="1.5" fill="#050505"/>
  <!-- Buttons Row 2 -->
  <rect x="31" y="50.5" width="7" height="7" rx="1.5" fill="#050505"/>
  <rect x="44.5" y="50.5" width="7" height="7" rx="1.5" fill="#050505"/>
  <!-- Buttons Row 3 -->
  <rect x="31" y="64" width="7" height="7" rx="1.5" fill="#050505"/>
